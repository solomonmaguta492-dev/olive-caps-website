<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Olive Caps</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#556b2f">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="" width="36" height="36">
        <span>Olive Caps Admin</span>
      </a>
      <nav class="main-nav" aria-label="Admin">
        <a href="index.html">View shop</a>
        <button type="button" class="btn btn-outline btn-small hidden" id="logout">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel admin-login" id="login-panel">
      <h1>Admin login</h1>
      <form id="login-form" class="form-grid">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="login-error" class="notice notice-error hidden" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
    </section>

    <div id="dashboard" class="hidden">
      <h1 class="page-title">Dashboard</h1>
      <div class="stats" id="stats"></div>

      <div class="admin-tabs" role="tablist">
        <button type="button" class="chip" role="tab" data-tab="orders" aria-pressed="true">Orders</button>
        <button type="button" class="chip" role="tab" data-tab="products" aria-pressed="false">Products & stock</button>
      </div>

      <section id="tab-orders">
        <div class="admin-toolbar">
          <label for="order-filter">Show</label>
          <select id="order-filter">
            <option value="all">All orders</option>
            <option value="paid">Paid</option>
            <option value="unpaid">Not paid</option>
            <option value="processing">To prepare</option>
          </select>
          <button type="button" class="btn btn-outline btn-small" id="refresh-orders">Refresh</button>
          <button type="button" class="btn btn-primary btn-small" data-excel="paid">Download sales (Excel)</button>
          <button type="button" class="btn btn-outline btn-small" data-excel="all">All orders (Excel)</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Order</th><th>Customer</th><th>Items</th><th>Fulfilment</th>
                <th>Total</th><th>Payment</th><th>Status</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-products" class="hidden">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Product</th><th>Category</th><th>Price</th><th>Wholesale</th><th>Stock</th><th>Actions</th></tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>

        <div class="panel mt-lg">
          <h2 id="product-form-title">Add a product</h2>
          <form id="product-form" class="form-grid two">
            <input type="hidden" name="id">
            <div class="field">
              <label for="p-name">Name</label>
              <input id="p-name" name="name" required>
            </div>
            <div class="field">
              <label for="p-category">Category</label>
              <select id="p-category" name="category"></select>
            </div>
            <div class="field">
              <label for="p-price">Price (KES)</label>
              <input id="p-price" name="price" type="number" min="1" required>
            </div>
            <div class="field">
              <label for="p-wholesale">Wholesale price (KES)</label>
              <input id="p-wholesale" name="wholesalePrice" type="number" min="1">
            </div>
            <div class="field">
              <label for="p-stock">Stock</label>
              <input id="p-stock" name="stock" type="number" min="0" required>
            </div>
            <div class="field">
              <label for="p-colours">Colours</label>
              <input id="p-colours" name="colours" placeholder="Olive, Black, Beige">
              <span class="hint">Separate with commas</span>
            </div>
            <div class="field">
              <label for="p-sizes">Sizes</label>
              <input id="p-sizes" name="sizes" placeholder="7, 7 1/8, 7 1/4">
              <span class="hint">Only for fitted caps. Leave empty for adjustable caps.</span>
            </div>
            <div class="field">
              <label for="p-image">Image path</label>
              <input id="p-image" name="image" placeholder="images/new-era/dodgers-59fifty-black.webp">
            </div>
            <div class="field">
              <label for="p-image-back">Back view image <span class="hint">(optional)</span></label>
              <input id="p-image-back" name="imageBack" placeholder="images/new-era/dodgers-59fifty-black-back.webp">
            </div>
            <div class="field">
              <label for="p-image-back-label">Second photo button text <span class="hint">(optional)</span></label>
              <input id="p-image-back-label" name="imageBackLabel" placeholder="Back view">
            </div>
            <div class="field">
              <label for="p-gallery">More photos <span class="hint">(optional)</span></label>
              <input id="p-gallery" name="gallery" placeholder="images/a.webp, images/b.webp">
              <span class="hint">Extra photo paths, separated by commas.</span>
            </div>
            <div class="field">
              <label for="p-description">Description</label>
              <textarea id="p-description" name="description"></textarea>
            </div>
            <div id="product-error" class="notice notice-error hidden" role="alert"></div>
            <div class="admin-toolbar">
              <button class="btn btn-primary" type="submit">Save product</button>
              <button class="btn btn-outline hidden" type="button" id="cancel-edit">Cancel</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
