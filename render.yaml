# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: olive-caps
    runtime: node
    # Build from the project root so the website (frontend/) is included.
    buildCommand: npm run setup
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Live site: test (mock) payments are switched off.
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MPESA_MODE
        value: mock
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
